name: Atualizar o mural

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  mural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar o segredo
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: "eb9d06d3-e965-495d-850f-0c43c977ca21"
          project-slug: "labch-30gg"
          env-slug: "prod"

      - name: Ler o formulário
        run: |
          if [ -z "$MURAL_CSV" ]; then
            echo "O MURAL_CSV não chegou do Infisical. Confira a identidade,"
            echo "o slug do projeto, o ambiente e a regra de subject do OIDC."
            exit 1
          fi
          node ferramentas/atualizar-mural.js

      - name: Publicar se mudou
        run: |
          if [ -z "$(git status --porcelain site/dados/lihof.json site/assets/noticias)" ]; then
            echo "Nada novo no mural."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/dados/lihof.json site/assets/noticias
          git commit -m "$((100000 + RANDOM % 900000))"
          git push
